<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">JAX and PyTorch parity pipeline</title>
  <desc id="desc">Shared preprocessing feeds equivalent PyTorch and JAX models followed by numerical parity checks.</desc>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="55" font-size="25" font-weight="700" fill="#15233b">One experiment, two ML backends</text>
    <rect x="55" y="165" width="150" height="78" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="130" y="195" font-size="17" fill="#15233b">Shared split, scale</text><text x="130" y="219" font-size="17" fill="#15233b">and mini-batches</text>
    <rect x="300" y="105" width="155" height="78" rx="7" fill="#fff3e8" stroke="#d77722" stroke-width="2"/>
    <text x="378" y="137" font-size="20" font-weight="700" fill="#9b4b09">PyTorch</text><text x="378" y="161" font-size="16" fill="#6c421e">MLP + AdamW</text>
    <rect x="300" y="260" width="155" height="78" rx="7" fill="#edf8fb" stroke="#2b8da8" stroke-width="2"/>
    <text x="378" y="292" font-size="20" font-weight="700" fill="#12667e">JAX</text><text x="378" y="316" font-size="16" fill="#245a68">JIT + PyTrees</text>
    <rect x="570" y="165" width="175" height="78" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="658" y="194" font-size="17" fill="#15233b">Prediction + gradient</text><text x="658" y="218" font-size="17" fill="#15233b">parity report</text>
    <g stroke="#356fa8" stroke-width="3" fill="none" marker-end="url(#arrow2)">
      <path d="M205 190C245 190 250 145 300 145"/><path d="M205 218C245 218 250 299 300 299"/>
      <path d="M455 145C520 145 515 190 570 190"/><path d="M455 299C520 299 515 218 570 218"/>
    </g>
  </g>
  <defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#356fa8"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="QLoRA fine tuning pipeline diagram">
  <rect width="800" height="450" rx="28" fill="#f8fafc"/>
  <rect x="44" y="46" width="712" height="358" rx="26" fill="#101828"/>
  <text x="72" y="94" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">QLoRA Fine-Tuning Lab</text>
  <text x="72" y="126" font-family="Inter, Arial, sans-serif" font-size="17" fill="#cbd5e1">4-bit frozen base weights with trainable low-rank adapters</text>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <rect x="72" y="190" width="124" height="70" rx="16" fill="#1e40af"/><text x="134" y="219" font-size="15" fill="#dbeafe">NF4</text><text x="134" y="242" font-size="13" fill="#bfdbfe">quantize W</text>
    <rect x="252" y="162" width="132" height="58" rx="16" fill="#7c3aed"/><text x="318" y="198" font-size="15" fill="#f3e8ff">LoRA A</text>
    <rect x="252" y="250" width="132" height="58" rx="16" fill="#7c3aed"/><text x="318" y="286" font-size="15" fill="#f3e8ff">LoRA B</text>
    <rect x="446" y="190" width="122" height="70" rx="16" fill="#059669"/><text x="507" y="219" font-size="15" fill="#dcfce7">adapter</text><text x="507" y="242" font-size="13" fill="#bbf7d0">ΔW = BA</text>
    <rect x="630" y="190" width="90" height="70" rx="16" fill="#0ea5e9"/><text x="675" y="219" font-size="15" fill="#e0f2fe">eval</text><text x="675" y="242" font-size="13" fill="#bae6fd">gen + loss</text>
  </g>
  <g stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round">

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">MovieLens recommendation pipeline</title>
  <desc id="desc">User-item interactions are split in time, modeled, ranked, and evaluated.</desc>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="55" font-size="25" font-weight="700" fill="#15233b">Recommendation experiment pipeline</text>
    <rect x="45" y="155" width="125" height="76" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="108" y="185" font-size="17" fill="#15233b">User–item</text><text x="108" y="208" font-size="17" fill="#15233b">ratings</text>
    <rect x="210" y="155" width="125" height="76" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="273" y="185" font-size="17" fill="#15233b">Temporal</text><text x="273" y="208" font-size="17" fill="#15233b">holdout</text>
    <rect x="385" y="80" width="135" height="62" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="453" y="118" font-size="17" fill="#15233b">Item-KNN</text>
    <rect x="385" y="163" width="135" height="62" rx="7" fill="#edf3ff" stroke="#356fa8" stroke-width="2"/>
    <text x="453" y="201" font-size="14" font-weight="700" fill="#1d568d">Matrix factorization</text>
    <rect x="385" y="246" width="135" height="62" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="453" y="284" font-size="17" fill="#15233b">BPR</text>
    <rect x="595" y="155" width="160" height="76" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="675" y="184" font-size="16" fill="#15233b">Recall · NDCG</text><text x="675" y="207" font-size="16" fill="#15233b">coverage · novelty</text>
    <g stroke="#356fa8" stroke-width="3" fill="none" marker-end="url(#arrow4)">
      <path d="M170 193h40"/><path d="M335 176c25 0 25-65 50-65"/><path d="M335 193h50"/><path d="M335 210c25 0 25 67 50 67"/>

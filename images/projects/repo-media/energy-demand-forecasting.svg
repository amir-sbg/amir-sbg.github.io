<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Hourly energy forecasting pipeline</title>
  <desc id="desc">Hourly demand is windowed, modeled with baselines and an LSTM, then calibrated and evaluated.</desc>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="55" font-size="25" font-weight="700" fill="#15233b">Multi-horizon energy forecasting</text>
    <polyline points="45,170 75,145 105,180 135,115 165,150 195,105 225,135" fill="none" stroke="#3178a8" stroke-width="4"/>
    <text x="135" y="220" font-size="16" fill="#52657d">hourly load + calendar</text>
    <rect x="270" y="130" width="130" height="82" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="335" y="162" font-size="17" fill="#15233b">Chronological</text><text x="335" y="187" font-size="17" fill="#15233b">windows</text>
    <rect x="455" y="85" width="135" height="70" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="523" y="114" font-size="17" fill="#15233b">Naive + Ridge</text><text x="523" y="137" font-size="15" fill="#52657d">baselines</text>
    <rect x="455" y="205" width="135" height="70" rx="7" fill="#edf3ff" stroke="#356fa8" stroke-width="2"/>
    <text x="523" y="234" font-size="18" font-weight="700" fill="#1d568d">LSTM</text><text x="523" y="257" font-size="15" fill="#52657d">direct horizon</text>
    <rect x="645" y="130" width="120" height="82" rx="7" fill="#fff" stroke="#6c7f99" stroke-width="2"/>
    <text x="705" y="160" font-size="16" fill="#15233b">Conformal</text><text x="705" y="183" font-size="16" fill="#15233b">intervals</text>
    <g stroke="#356fa8" stroke-width="3" fill="none" marker-end="url(#arrow3)">
      <path d="M225 160h45"/><path d="M400 155c25 0 25-35 55-35"/><path d="M400 188c25 0 25 52 55 52"/>
      <path d="M590 120c30 0 25 35 55 35"/><path d="M590 240c30 0 25-52 55-52"/>
    </g>
    <text x="400" y="355" font-size="17" fill="#52657d">MAE · MASE · Diebold–Mariano · coverage</text>
  </g>
  <defs><marker id="arrow3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#356fa8"/></marker></defs>
</svg>
